[target.x86_64-pc-windows-msvc]
# The whole GPUI frontend runs on the main thread. The Windows default 1MB
# main-thread stack is too small for first-frame render/layout depth plus
# large page-builder frames (the Skins page overflowed it with 0xC00000FD),
# so reserve 8MB like other native UI applications do.
rustflags = ["-C", "link-args=/STACK:8388608"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-args=-Wl,--stack,8388608"]

